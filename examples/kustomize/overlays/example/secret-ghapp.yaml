# PLACEHOLDER. In production, deliver this via external-secrets /
# sealed-secrets / SOPS. The PEM below is a literal placeholder; paste
# the contents of the GitHub App's downloaded private key (.pem) and
# strip the leading whitespace from each line.
apiVersion: v1
kind: Secret
metadata:
  name: pacer-ghapp
  namespace: pacer
type: Opaque
stringData:
  gh-app.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_THE_PEM_DOWNLOADED_FROM_THE_GITHUB_APP_SETTINGS_PAGE
    -----END RSA PRIVATE KEY-----
