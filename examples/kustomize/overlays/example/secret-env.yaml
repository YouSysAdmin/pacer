# PLACEHOLDER. In production, replace this with external-secrets /
# sealed-secrets / SOPS so cluster manifests stop being a credential
# store. The plain Secret here is for the walkthrough only.
#
# Generate fresh hex values:
#   openssl rand -hex 32   # PACER_AUTH_JWT_SECRET
#   openssl rand -hex 32   # PACER_GITHUB_CALLBACK_HMAC_SECRET
#
# PACER_GITHUB_WEBHOOK_SECRET must match the value you set under
# the GitHub App's "Webhook secret" field on github.com.
apiVersion: v1
kind: Secret
metadata:
  name: pacer-env
  namespace: pacer
type: Opaque
stringData:
  PACER_AUTH_JWT_SECRET: REPLACE_WITH_HEX_FROM_OPENSSL_RAND
  PACER_GITHUB_WEBHOOK_SECRET: REPLACE_WITH_HEX_FROM_GITHUB_APP_WEBHOOK_SECRET
  PACER_GITHUB_CALLBACK_HMAC_SECRET: REPLACE_WITH_HEX_FROM_OPENSSL_RAND
