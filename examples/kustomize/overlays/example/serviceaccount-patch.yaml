apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacer
  namespace: pacer
  annotations:
    # IRSA. The IAM role's trust policy must match
    #   system:serviceaccount:pacer:pacer
    # and grant sts:AssumeRoleWithWebIdentity to the cluster's OIDC
    # provider. See docs/installation/server.md (Kubernetes section).
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pacer
