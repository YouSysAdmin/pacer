<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="cs-doc{{ if .IsHome }} cs-home{{ end }}">
  {{ partial "nav.html" . }}
  <div class="cs-shell">
    {{ if not .IsHome }}{{ partial "sidebar.html" . }}{{ end }}
    <main class="cs-main{{ if .IsHome }} cs-main-wide{{ end }}" id="content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ if and (not .IsHome) (not .IsSection) (gt (len .TableOfContents) 50) }}
      {{ partial "toc.html" . }}
    {{ end }}
  </div>
  {{ partial "footer.html" . }}
</body>
</html>
