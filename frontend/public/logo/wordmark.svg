<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <title>Pacer</title>
  <desc>Pacer wordmark logo (dark theme variant) - three velocity chevrons with light wordmark.</desc>

  <!-- Icon -->
  <g transform="translate(10, 10)">
    <path d="M 0 80 L 30 40 L 0 0 L 20 0 L 50 40 L 20 80 Z" fill="#FF6B35"/>
    <path d="M 35 80 L 65 40 L 35 0 L 55 0 L 85 40 L 55 80 Z" fill="#F7931E"/>
    <path d="M 70 80 L 100 40 L 70 0 L 90 0 L 120 40 L 90 80 Z" fill="#FFC107" opacity="0.85"/>
  </g>

  <!-- Wordmark (light for dark backgrounds) -->
  <text x="155" y="65"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56"
        font-weight="600"
        fill="#F3F4F6"
        letter-spacing="-1">pacer</text>
</svg>
